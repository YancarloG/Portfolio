<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- CSP: allow Firebase + gapi and our inline module -->
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  connect-src 'self'
    https://firestore.googleapis.com
    https://*.googleapis.com
    https://securetoken.googleapis.com
    https://identitytoolkit.googleapis.com
    https://www.googleapis.com
    https://*.gstatic.com;
  script-src 'self' 'unsafe-inline' 'unsafe-eval'
    https://www.gstatic.com
    https://www.googleapis.com
    https://firestore.googleapis.com
    https://apis.google.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self' data:;
  frame-src 'self'
    https://yantento-atm.firebaseapp.com
    https://*.firebaseapp.com
    https://apis.google.com;
  child-src 'self'
    https://yantento-atm.firebaseapp.com
    https://*.firebaseapp.com
    https://apis.google.com;
"/>


  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATM Status Board | Yantento</title>

  <style>
    :root { --bg:#0a0f1e; --text:#e6f0ff; --glass:rgba(255,255,255,0.08); --accent:#00c8ff; --card:#14213d; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text);}
    a { color: var(--accent); text-decoration: none; }
    .page { max-width:1100px; margin:32px auto; padding:0 16px; }
    .glass { background:var(--glass); backdrop-filter:blur(18px); border-radius:20px; box-shadow:0 8px 32px rgba(0,0,0,0.25); padding:24px; }
    .header { display:flex; flex-wrap:wrap; align-items:center; gap:16px; justify-content:space-between; margin-bottom:16px; }
    .title { font-size:1.6rem; font-weight:800; margin:0; display:flex; align-items:center; gap:8px; }
    .subtitle { opacity:.85; margin:.25rem 0 0 0; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .input { background:#0f1b2f; color:var(--text); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:10px 12px; min-width:220px; }
    .modern-button { background:var(--card); color:#fff; padding:10px 16px; border:0; border-radius:10px; cursor:pointer; box-shadow:0 0 8px rgba(0,200,255,.25); transition:transform .2s, box-shadow .2s; }
    .modern-button:hover { transform:translateY(-1px); box-shadow:0 0 16px rgba(0,200,255,.45); }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap:16px; margin-top:16px; }
    .card { border-radius:16px; background: rgba(17, 27, 52, 0.7); border:1px solid rgba(255,255,255,0.08); padding:16px; display:flex; flex-direction:column; gap:10px; }
    .card h3 { margin:0; font-size:1.05rem; }
    .addr { font-size:0.95rem; opacity:0.9; line-height:1.4; }
    .note { font-size:0.85rem; opacity:0.8; }
    .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .spacer { flex:1; }
    .badge { padding:4px 10px; border-radius:999px; font-size:0.8rem; font-weight:700; letter-spacing:.2px; border:1px solid transparent; }
    .up { background:rgba(0,180,60,.18); color:#86f7a1; border-color:rgba(134,247,161,.35); }
    .down { background:rgba(200,30,30,.18); color:#ff9a9a; border-color:rgba(255,154,154,.35); }
    .unknown { background:rgba(255,255,255,.08); color:#cfe3ff; border-color:rgba(255,255,255,.15); }
    .meta { font-size:0.8rem; opacity:0.85; }
    .btn-sm { padding:8px 12px; border-radius:10px; border:0; cursor:pointer; }
    .btn-up { background:#0b5d35; color:#eafff2; }
    .btn-down { background:#6b1220; color:#ffe9ec; }
    .btn-dir { background:#0c1a32; color:#d5ecff; display:inline-block; }
    .footnote { margin-top:18px; font-size:0.85rem; opacity:0.8; }
    .hr { height:1px; background:rgba(255,255,255,0.1); margin:16px 0; border:0; }
    .disabled { opacity:.6; pointer-events:none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="glass">
      <div class="header">
        <div>
          <h1 class="title">
            ATM Status Board
            <span id="cloudBadge" class="badge unknown">Local</span>
          </h1>
          <p class="subtitle">Mark an ATM as <em>Working</em> or <em>Down</em>. Statuses auto-expire after 6 hours.</p>
        </div>
        <div class="controls">
          <input id="displayName" class="input" type="text" placeholder="Optional: your display name" />
          <button id="saveName" class="modern-button">Save Name</button>
        </div>
      </div>

      <div id="atmGrid" class="grid"></div>

      <div class="footnote">
        <div class="hr"></div>
        <p><strong>Note:</strong> Community tool; not affiliated with Partners FCU or TWDC. Check access restrictions and verify availability before traveling.</p>
      </div>
    </div>
  </div>

  <!-- ================= Firebase CONFIG ================= -->
  <script>
    /* If this object is null, app runs in localStorage-only mode. */
    window.FB_CONFIG = {
      apiKey: "AIzaSyATTBsFpadqwcAV7Vf92lwPEmQK3P5GzaM",
      authDomain: "yantento-atm.firebaseapp.com",
      projectId: "yantento-atm",
      appId: "1:444236583383:web:a42f08ef79375470033b92"
    };
  </script>

  <!-- ================= App Logic ================= -->
  <script type="module">
    // ---------- Seed list of ATMs ----------
    const ATM_LIST = [
      { id: "mk-mouseketeria", name: "Partners FCU – Magic Kingdom (TWDC Cast Only, MKT Mouseketeria)", address: "1180 Seven Seas Drive, Lake Buena Vista, FL 32831", access: "TWDC Cast Only" },
      { id: "epcot",           name: "Partners FCU – EPCOT (TWDC Only)", address: "1510 N Avenue of the Stars, Lake Buena Vista, FL 32830", access: "TWDC Only" },
      { id: "dc2-live-oak",    name: "Partners FCU – DC2 Parking (Live Oak Lane)", address: "1825 Live Oak Lane, Lake Buena Vista, FL 32830", access: "Public*" },
      { id: "lbv-drive-up",    name: "Partners FCU – Lake Buena Vista (Drive Up)", address: "1675 Lake Buena Vista Blvd., Lake Buena Vista, FL 32830", access: "Public" },
      { id: "pride-rock",      name: "Partners FCU ATM – Pride Rock (TWDC Cast Only)", address: "660 W. Savannah Circle, Lake Buena Vista, FL 32830", access: "TWDC Cast Only" },
      { id: "dhs",             name: "Partners FCU – Disney's Hollywood Studios (TWDC Cast Only)", address: "228 Cypress Dr., Bay Lake, FL 32830", access: "TWDC Cast Only" },
      { id: "team-disney",     name: "Partners FCU – Team Disney Lobby (temporarily unavailable)", address: "1375 Buena Vista Drive, Lake Buena Vista, FL 32830", access: "TWDC Access" },
      { id: "maingate",        name: "Partners FCU – 3020 Maingate Complex (Residents Only, Withdrawals Only)", address: "3020 Maingate Lane, Orlando, FL 32821", access: "Residents Only" }
    ];

    // ---------- Settings ----------
    const EXPIRY_HOURS = 6;     // status becomes Unknown after this many hours
    const RATE_MINUTES = 1;     // local per-device cooldown (client)
    const SERVER_COOLDOWN_MS = 45 * 1000; // must match your Firestore rules

    // ---------- Elements ----------
    const grid = document.getElementById('atmGrid');
    const nameInput = document.getElementById('displayName');
    const saveNameBtn = document.getElementById('saveName');
    const cloudBadge = document.getElementById('cloudBadge');

    nameInput.value = localStorage.getItem('atm.displayName') || '';
    saveNameBtn.addEventListener('click', () => {
      localStorage.setItem('atm.displayName', nameInput.value.trim());
      saveNameBtn.textContent = 'Saved';
      setTimeout(() => saveNameBtn.textContent = 'Save Name', 1200);
    });

    // ---------- Helpers ----------
    const mapsLink = (address) => `https://www.google.com/maps?q=${encodeURIComponent(address)}`;
    function prettyTime(t){
      if (!t) return '—';
      const d = new Date(t);
      const m = Math.floor((Date.now() - d.getTime())/60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m/60);
      if (h < 24) return `${h}h ago`;
      return `${Math.floor(h/24)}d ago`;
    }
    function isExpired(updatedAt){
      if (!updatedAt) return true;
      const t = (updatedAt instanceof Date) ? updatedAt.getTime()
              : (updatedAt?.seconds ? updatedAt.seconds*1000 : Number(updatedAt));
      return (Date.now() - t) > EXPIRY_HOURS*60*60*1000;
    }
    const statusBadge = (data) =>
      (!data || !data.status || isExpired(data.updatedAt)) ? `<span class="badge unknown">Unknown</span>`
      : (data.status === 'up' ? `<span class="badge up">Working</span>`
                              : `<span class="badge down">Down</span>`);
    function metaLine(data){
      if (!data || isExpired(data.updatedAt)) return 'Last update: —';
      const by = data.updatedBy || '—';
      const when = data.updatedAt?.seconds ? new Date(data.updatedAt.seconds*1000) : new Date(data.updatedAt);
      const up = data.upVotes || 0, down = data.downVotes || 0;
      return `Last update: ${prettyTime(when)} · by ${by} · ▲${up} ▼${down}`;
    }
    function updateCard(atmId, data) {
      const meta = document.getElementById(`meta-${atmId}`);
      const card = document.getElementById(`card-${atmId}`);
      if (!card) return;
      if (meta) meta.innerHTML = metaLine(data);
      const oldBadge = card.querySelector('.badge');
      if (oldBadge) oldBadge.outerHTML = statusBadge(data);
    }

    // ---------- Local cooldown ----------
    const RATE_KEY = (id) => `atm.vote.${id}`;
    const canVote = (id) => Date.now() - Number(localStorage.getItem(RATE_KEY(id))||0) > RATE_MINUTES*60*1000;
    const markVoted = (id) => localStorage.setItem(RATE_KEY(id), String(Date.now()));

    // ---------- Storage Abstraction ----------
    class LocalStore {
      constructor(prefix='atmStatus.') { this.prefix=prefix; }
      _k(id){ return `${this.prefix}${id}`; }
      async get(id){ const raw = localStorage.getItem(this._k(id)); return raw? JSON.parse(raw): null; }
      async set(id,data){ localStorage.setItem(this._k(id), JSON.stringify(data)); }
      async getAll(){ const out={}; for (const atm of ATM_LIST) out[atm.id]=await this.get(atm.id); return out; }
    }
    let Store = new LocalStore();

    // ---------- Enable Firebase (cloud mode) ----------
    let db = null;
    let authed = false;

    if (window.FB_CONFIG && window.FB_CONFIG.apiKey && window.FB_CONFIG.projectId) {
      try {
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js');
        const { getFirestore, doc, getDoc, getDocs, setDoc, increment, serverTimestamp, onSnapshot, enableIndexedDbPersistence, collection } =
          await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js');
        const { getAuth, signInAnonymously, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js');

        const app = initializeApp(window.FB_CONFIG);
        db = getFirestore(app);
        try { await enableIndexedDbPersistence(db); } catch (_) { /* OK if multi-tab */ }

        const auth = getAuth(app);
        onAuthStateChanged(auth, (u) => {
          authed = !!u;
          console.log('Auth state:', authed ? `✅ anon ${u.uid}` : '❌ not authed');
        });
        await signInAnonymously(auth);

        class FireStore {
          async get(id){ const ref = doc(db,'atms',id); const snap = await getDoc(ref); return snap.exists()? snap.data(): null; }
          async set(id,data){ const ref=doc(db,'atms',id); await setDoc(ref,{...data, updatedAt: serverTimestamp()},{merge:true}); }
          async vote(id,status,displayName){
            const field = status==='up' ? 'upVotes' : 'downVotes';
            const ref = doc(db,'atms',id);
            await setDoc(ref, {
              status,
              updatedBy: displayName || 'Anonymous',
              [field]: increment(1),
              updatedAt: serverTimestamp(),
              lastBy: (await import('https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js'))
                        .then(({getAuth}) => getAuth().currentUser?.uid || 'anon')
            }, { merge: true }); 
          async getAll(){
            const out = {};
            const col = collection(db, 'atms');
            const snaps = await getDocs(col);
            snaps.forEach(s => out[s.id] = s.data());
            for (const atm of ATM_LIST) if (!(atm.id in out)) out[atm.id] = null;
            return out;
          }
        }
        Store = new FireStore();
        if (cloudBadge){ cloudBadge.textContent='Cloud'; cloudBadge.className='badge up'; }

        // Live updates
        for (const atm of ATM_LIST) {
          onSnapshot(doc(db, 'atms', atm.id), (snap) => {
            if (snap.exists()) updateCard(atm.id, snap.data());
          });
        }

        await render();

      } catch (e) {
        console.warn('Firebase init failed; using local mode.', e);
      }
    }

    // ---------- Server cooldown pre-check ----------
    async function serverCooldownRemainMs(atmId) {
      try {
        const data = await Store.get(atmId);
        if (!data || !data.updatedAt) return 0;
        const last = data.updatedAt?.seconds ? data.updatedAt.seconds * 1000 : Number(data.updatedAt);
        const remain = SERVER_COOLDOWN_MS - (Date.now() - last);
        return Math.max(0, remain);
      } catch { return 0; }
    }

    // ---------- UI ----------
    async function render(){
      const all = await Store.getAll();
      grid.innerHTML = ATM_LIST.map(atm => {
        const data = all[atm.id];
        return `
          <div class="card" id="card-${atm.id}">
            <div class="row">
              <h3>${atm.name}</h3>
              <div class="spacer"></div>
              ${statusBadge(data)}
            </div>
            <div class="addr">${atm.address}</div>
            <div class="note">Access: ${atm.access}</div>
            <div class="row">
              <button class="btn-sm btn-up ${authed ? '' : 'disabled'}" data-up="${atm.id}">Mark Working</button>
              <button class="btn-sm btn-down ${authed ? '' : 'disabled'}" data-down="${atm.id}">Mark Down</button>
              <a class="btn-sm btn-dir" href="${mapsLink(atm.address)}" target="_blank" rel="noopener">Get Directions</a>
            </div>
            <div class="meta" id="meta-${atm.id}">${metaLine(data)}</div>
          </div>
        `;
      }).join('');
      grid.querySelectorAll('[data-up]').forEach(el => el.addEventListener('click', () => handleVote(el.getAttribute('data-up'),'up')));
      grid.querySelectorAll('[data-down]').forEach(el => el.addEventListener('click', () => handleVote(el.getAttribute('data-down'),'down')));
    }

    async function handleVote(atmId, status){
      if (!authed && Store.vote) {
        alert('Signing in… please try again in a moment.');
        return;
      }

      if (!canVote(atmId)) {
        alert(`Thanks! You can update this ATM again in about ${RATE_MINUTES} minute(s).`);
        return;
      }

      const remainMs = await serverCooldownRemainMs(atmId);
      if (remainMs > 0) {
        const secs = Math.ceil(remainMs / 1000);
        alert(`Server cooldown active. Try again in ~${secs} second(s).`);
        return;
      }

      const displayName = (nameInput.value || '').trim() || 'Anonymous';

      // Optimistic local update
      const existing = await Store.get(atmId) || {};
      const upVotes = existing.upVotes || 0, downVotes = existing.downVotes || 0;
      const optimistic = {
        status,
        updatedBy: displayName,
        updatedAt: Date.now(),
        upVotes: status === 'up' ? upVotes + 1 : upVotes,
        downVotes: status === 'down' ? downVotes + 1 : downVotes
      };

      try {
        if (Store.vote) {
          await Store.vote(atmId, status, displayName); // cloud mode
        } else {
          await Store.set(atmId, optimistic);           // local mode
        }
        markVoted(atmId);
        updateCard(atmId, optimistic);
      } catch (e) {
        console.error('Vote failed:', e);
        alert(`Write blocked by server rules or auth:\n${e?.message || e}`);
      }
    }

    render();
  </script>
</body>
</html>
