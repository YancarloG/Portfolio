<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bankeze for Android (Prototype)</title>

  <!-- External stylesheet ensures this page matches the site's overall theme -->
  <link rel="stylesheet" href="../style.css" />

  <style>
    /* Style individual app screenshots with spacing, shadow, and interactivity */
    .screenshot {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      margin: 1rem;
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.2);
      transition: transform 0.3s;
    }

    /* Add a subtle zoom effect when the user hovers over the image */
    .screenshot:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00c8ff;
    }

    /* Style the APK download button so it stands out */
    .apk-button {
      margin-top: 2rem;
      font-size: 1.1rem;
      padding: 1rem 2rem;
    }

    /* Flexbox layout for screenshots – adjusts responsively */
    .image-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
  </style>
</head>

<body>
  <!-- Main content container styled like other pages (glassmorphism, centered) -->
  <main class="glass content-box">

    <!-- Title of the app section -->
    <h1 class="welcome-heading">Bankeze Calculator for Android</h1>

    <!-- Introductory explanation of what the Android app does -->
    <p class="intro-text">
      This is the Android version of my Bankeze Calculator — a tool designed to help servers and service workers track tips, charges, and payouts quickly and easily. The app is optimized for speed, simplicity, and offline use.
    </p>

    <!-- Screenshot preview row for users to see what the app looks like before downloading -->
    <div class="image-row">
      <img src="../assets/appOpen1.JPG" alt="Bankeze Android Screenshot 1" class="screenshot" />
      <img src="../assets/appOpen3.JPG" alt="Bankeze Android Screenshot 2" class="screenshot" />
      <img src="../assets/appOpen4.JPG" alt="Bankeze Android Screenshot 3" class="screenshot" />
      <img src="../assets/homeScreenApp.JPG" alt="Home Screen Icon" class="screenshot" />
    </div>

    <!-- Download button linked to the actual APK file in the assets folder -->
    <a href="../assets/app-debug.apk" class="modern-button apk-button" download>
      Download APK
    </a>
  </main>
</body>
</html>
