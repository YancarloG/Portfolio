<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>BankezeCalculator</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="main.js" defer></script>
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey && ['u', 's', 'c', 'j'].includes(e.key)) || e.key === 'F12') e.preventDefault();
    });
  </script>
</head>
<body>
  <img src="Bank-eze.png" alt="Bankeze Logo" class="logo" onclick="shakePage()" />

  <div id="darkModeToggleWrapper">
    <button id="darkModeToggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
  </div>

  <h1>BankezeCalculator</h1>

  <div class="form-container">
    <div class="form-group">
      <label for="paymentType">Payment Type</label>
      <select id="paymentType">
        <option>American Express</option>
        <option>Discover</option>
        <option>Disney Rewards Card</option>
        <option>Guest ID</option>
        <option>JCB Card</option>
        <option>Mastercard</option>
        <option>Value Card</option>
        <option>Visa</option>
        <option>Adult Dining Plan</option>
        <option>Child Dining Plan</option>
        <option>Coupons</option>
        <option>Cash</option>
      </select>
    </div>

    <div class="form-group">
      <label for="amount">Charge Amount ($)</label>
      <input type="number" id="amount" step="0.01" />
    </div>

    <div class="form-group">
      <label for="tip">Tip Amount ($)</label>
      <input type="number" id="tip" step="0.01" />
    </div>

    <div class="form-group">
      <label for="entryDate">Date of Entry</label>
      <input type="date" id="entryDate" value="2025-07-05" />
    </div>

    <button class="btn main-btn" onclick="addPayment()">Add Payment</button>

    <div class="form-group">
      <label for="selectDate">Select Date for Viewing</label>
      <select id="selectDate"></select>
    </div>

    <button class="btn" onclick="populateAndShowResults()">Show Totals</button>
    <button class="btn" onclick="populateAndShowEntries()">View All Entries</button>
    <button class="btn" onclick="clearEntriesForSelectedDate()">Clear All for Viewing Date</button>
    <button class="btn danger" onclick="clearAllEntries()">🧨 Clear All Data (All Dates)</button>
    <button class="btn" onclick="showSummary()">View Summary</button>
  </div>

  <div class="form-container">
    <h3>Work Tracking</h3>

    <div class="form-group">
      <label for="payRate">Hourly Pay Rate ($)</label>
      <input type="number" id="payRate" step="0.01" />
    </div>

    <div class="form-group">
      <label for="clockInTime">Clock In Time</label>
      <input type="time" id="clockInTime" value="16:00" />
    </div>

    <div class="form-group">
      <label for="clockOutTime">Clock Out Time</label>
      <input type="time" id="clockOutTime" value="23:00" />
    </div>

    <div class="form-group"><label>Hours Worked:</label><div id="hoursWorked"></div></div>
  </div>

  <div class="results-container" id="results" style="display: none">
    <table id="resultsTable">
      <thead>
        <tr>
          <th>Payment Type</th>
          <th># of Slips</th>
          <th>$ Revenue</th>
          <th>Total w/ Tips</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="form-group"><label>Total in Cash Transactions:</label><div id="totalCash"></div></div>
    <div class="form-group"><label>Cash Tips:</label><div id="cashTips"></div></div>
    <div class="form-group"><label>Less Charge Tips:</label><div id="lessTips"></div></div>
    <div class="form-group"><label>Total Cash Responsibility:</label><div id="cashResponsibility"></div></div>
    <div class="form-group"><label>Average Tip %:</label><div id="avgTip"></div></div>
  </div>

  <div class="results-container" id="entryLog" style="display:none">
    <h3 style="text-align:center">All Entries</h3>
    <ul id="entryList"></ul>
  </div>

  <div class="results-container" id="summaryView" style="display:none">
    <h3 style="text-align:center">Tips Summary (All-Time)</h3>
    <canvas id="summaryChart" width="100%" height="60"></canvas>
    <div class="form-group"><label>Biggest Tip:</label><div id="biggestTip"></div></div>
    <div class="form-group"><label>Smallest Tip:</label><div id="smallestTip"></div></div>
    <div class="form-group"><label>Average Tip %:</label><div id="averageTipPercent"></div></div>
    <div class="form-group"><label>Average Hourly Rate (with tips):</label><div id="averageHourly"></div></div>
  </div>

  <div id="donateWrapper" class="hidden">
    <a href="https://cash.app/$Yantento" target="_blank" class="donate-btn">💸Donate💸</a>
  </div>

  <footer style="text-align:center; margin-top: 40px; font-size: 14px; opacity: 0.6;">
    &copy; 2025 Bankeze Calculator | Designed by <strong>Yantento</strong>
  </footer>
</body>
</html>
