<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yantento.com</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Dark Mode Toggle Button -->
  <button id="toggle-darkmode">🌓</button>

  <!-- Background Music -->
  <audio id="bg-music" loop>
    <source src="music/song1.mp3" type="audio/mpeg" />
  </audio>

  <!-- Fullscreen Background Video -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="assets/cyber-bg.mp4" type="video/mp4" />
  </video>

  <!-- Intro Screen -->
  <div id="intro-screen" class="glass">
    <h1 class="intro-title">Yantento.com — Created by Yan Guzman</h1>
    <button id="enter-btn" class="modern-button">Enter</button>
  </div>

  <!-- Main Content (Hidden at First) -->
  <main id="main-content" class="hidden">
    <div class="glass content-box">
      <h1 class="welcome-heading">Welcome to Yantento.com</h1>
      <p class="intro-text">Explore featured builds by Yan Guzman:</p>
      <div class="button-stack">
        <a id="launch-wt-btn" href="weight-tracker/login.html" class="modern-button">Weight Tracker</a>
        <a id="launch-bank-btn" href="bankeze-calculator/index.html" class="modern-button">Bankeze Calculator</a>
      </div>
    </div>
  </main>

  <!-- Centered GIF Music Toggle -->
  <div id="gif-trigger">
    <img id="glitch-gif" src="assets/gif1.gif" alt="Toggle Music" />
  </div>

  <!-- Main Script -->
  <script src="main.js"></script>
</body>
</html>
